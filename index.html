<!DOCTYPE html>
<!--
  ============================================================================
  Personal Digital Card / NFC Landing Page  ·  个人电子名片 / NFC 落地页
  ----------------------------------------------------------------------------
  ✦ Single-file template (HTML + inline CSS + inline JS). No build step.
  ✦ Deploy: just upload this file to GitHub Pages (or any static host).
  ✦ Customize: edit ONLY the `CARD_CONFIG` object at the top of <script>.
  ✦ 模板化: 只修改下方 <script> 中的 CARD_CONFIG 即可,无需改动其它代码。
  ============================================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <!-- Mobile-first viewport. viewport-fit=cover 适配刘海屏安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!--
    ⚠️ OG / 社交分享标签 (Static metadata for link previews)
    说明: 搜索引擎与微信/Telegram 等爬虫不会执行 JS,因此这些标签需要手动填写。
    部署前请替换下面 title / description / image 为你的真实信息。
    (脚本运行后也会尝试用 CARD_CONFIG 动态更新,但静态值才是爬虫读取的来源。)
  -->
  <title>Hairuo Liu · Digital Card</title>
  <meta name="description" content="Ex-Amazon in Ads · AWS Certified Solutions Architect · Software & Hardware Product Maker" />
  <meta property="og:title" content="Hairuo Liu · Digital Card" />
  <meta property="og:description" content="Ex-Amazon in Ads · AWS Certified Solutions Architect · Software & Hardware Product Maker" />
  <meta property="og:type" content="profile" />
  <meta property="og:image" content="https://hairuoliu.github.io/nfc-card/avatar.png" />

  <!-- FontAwesome CDN (图标库,含品牌图标) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!--
    📲 PWA / 添加到主屏幕 (Add to Home Screen)
    Safari: 分享 → 添加到主屏幕;  Android Chrome: 浏览器菜单 → 安装应用。
    图标来自仓库里的 icon-*.png (由 avatar.png 生成) —— 换头像时记得同步替换图标。
  -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Digital Card" />
  <meta name="theme-color" content="#0d0d0d" />

  <!-- QR 码生成库 (名片页"扫一扫"按钮用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ======================================================================
       THEME TOKENS  ·  主题变量
       这些变量会被 JS 根据 CARD_CONFIG.theme 动态覆盖,
       你也可以直接在这里硬编码修改。
       ====================================================================== */
    :root {
      --gradient-start: #0d0d0d;   /* 背景渐变起始色 (overridden by JS) */
      --gradient-end:   #2a2300;   /* 背景渐变结束色 (overridden by JS) */
      --accent:         #FFB800;   /* 主按钮背景色 (overridden by JS)    */
      --glass-bg:       rgba(255, 255, 255, 0.10);
      --glass-border:   rgba(255, 255, 255, 0.22);
      --text:           rgba(255, 255, 255, 0.96);
      --text-dim:       rgba(255, 255, 255, 0.70);
      --radius:         26px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }

    /* iOS standalone 防白条: html 画布必须有深色底 —— 冷启动时 iOS 视口计算偏小,
       body 未铺满的区域会露出画布底色 (不设就是纯白); 顺带禁掉橡皮筋回弹露底 */
    html {
      background: var(--gradient-end);
      overscroll-behavior-y: none;
    }

    /* ---- Body: 渐变背景 + 居中布局 ---- */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      /* 注意: 这里不要用 background-attachment: fixed —— iOS standalone 下渲染异常,
         会在底部露出白色条带 (滚动一次才恢复) */
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      /* 适配 iOS 安全区 (刘海/底部 home 指示条) */
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    /* ---- Glassmorphic 主卡片 ---- */
    .card {
      width: 100%;
      max-width: 430px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      padding: 34px 26px 28px;
      text-align: center;
      /* 加载淡入动画 */
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* ---- 头像 / Avatar ---- */
    .avatar {
      width: 104px; height: 104px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 700; letter-spacing: 1px;
      color: var(--gradient-start);
      background: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 0 6px rgba(255, 184, 0, 0.22);
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ---- 文字信息 ---- */
    .name  { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .title { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; font-weight: 500; }
    .bio   { font-size: 14px; line-height: 1.55; color: var(--text-dim); margin-bottom: 22px; }
    .bio-line { display: block; }                 /* 每段简介独立成行 */
    .bio-line + .bio-line { margin-top: 5px; }    /* 段间留白 */

    /* ---- 主按钮 (保存通讯录) ---- */
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%; padding: 15px; border: none; border-radius: 16px;
      background: var(--accent); color: #1a1a1a; font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }
    .btn-primary:hover  { filter: brightness(0.94); box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3); }
    .btn-primary:active { transform: scale(0.96); }   /* 点击缩放反馈 */

    /* ---- 社交按钮组 ---- */
    .socials {
      display: flex; justify-content: center; gap: 18px;
      margin: 24px 0 6px; flex-wrap: wrap;
    }
    .social-btn {
      width: 54px; height: 54px; border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.10);
      color: #fff; font-size: 21px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }
    /* 悬停/点击时显示品牌色 */
    .social-btn:hover  { background: var(--brand); color: #fff; box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3); }
    .social-btn:active { transform: scale(0.9); }

    /* ---- 底部联系方式 ---- */
    .footer {
      margin-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.18);
      padding-top: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .footer-row {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 13.5px; color: var(--text-dim); text-decoration: none;
    }
    .footer-row i { font-size: 14px; }
    .footer-row:active { color: #fff; }

    /* ---- 底部三个次要操作 (三列网格: 图标在上 + 小字在下, 触摸目标 ≥64px) ---- */
    .share-row {
      margin-top: 14px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .share-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      min-height: 64px; padding: 10px 4px; border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.10); color: var(--text);
      font-size: 11px; font-weight: 600; line-height: 1.2; cursor: pointer;
      transition: transform 0.15s ease, background 0.25s ease;
    }
    .share-btn i { font-size: 17px; line-height: 1; }
    .share-btn:hover  { background: rgba(255, 255, 255, 0.20); }
    .share-btn:active { transform: scale(0.95); }

    /* ---- 微信弹窗 / WeChat Modal ---- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; opacity: 0; visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease; z-index: 50;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal {
      background: #fff; color: #222; border-radius: 22px;
      padding: 26px 24px; width: 100%; max-width: 320px; text-align: center;
      transform: scale(0.92); transition: transform 0.25s ease;
      position: relative;
    }
    .modal-overlay.show .modal { transform: scale(1); }
    .modal-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; font-size: 20px; color: #999; cursor: pointer;
    }
    .modal-icon {
      width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 10px;
      background: #07C160; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .modal h3 { font-size: 17px; margin-bottom: 14px; }
    .modal-qr { width: 180px; height: 180px; object-fit: contain; margin: 0 auto 12px; border-radius: 12px; }
    .modal-qr-placeholder {
      width: 180px; height: 180px; margin: 0 auto 12px; border-radius: 12px;
      background: #f2f2f2; color: #999; font-size: 13px;
      display: flex; align-items: center; justify-content: center; padding: 12px;
    }
    .modal-wechat-id { font-size: 14px; color: #555; margin-bottom: 14px; word-break: break-all; }
    .modal-btn {
      width: 100%; padding: 12px; border: none; border-radius: 14px;
      background: #07C160; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
    }
    .modal-btn:hover  { filter: brightness(0.95); }
    .modal-btn:active { transform: scale(0.96); }

    /* ---- Toast 轻提示 ---- */
    .toast {
      position: fixed; left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: rgba(0, 0, 0, 0.82); color: #fff;
      padding: 11px 20px; border-radius: 30px; font-size: 13.5px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 60; max-width: 84%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- 顶部"添加到主屏幕"提示 (仅移动端, 悬浮胶囊, 5 秒后淡出上滑消失) ---- */
    .install-hint {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 50%; z-index: 80;
      display: inline-flex; align-items: center; gap: 8px;
      max-width: calc(100vw - 32px); white-space: nowrap;
      padding: 8px 16px 8px 9px; border-radius: 999px;
      background: rgba(20, 20, 20, 0.84);
      backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid rgba(255, 184, 0, 0.30);   /* 金色只做 1px 点缀, 不抢主按钮 */
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      color: var(--text); font-size: 13px; font-weight: 600; letter-spacing: 0.2px;
      pointer-events: none;
      opacity: 0; transform: translateX(-50%) translateY(-24px);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .install-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .install-hint.hide { opacity: 0; transform: translateX(-50%) translateY(-24px); }
    .install-hint__icon {
      flex: none; width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 184, 0, 0.16); color: var(--accent); font-size: 11px;
      box-shadow: 0 0 0 1px rgba(255, 184, 0, 0.4);
    }
    .install-hint.show .install-hint__icon { animation: iconPulse 1.1s ease-out 2; }
    @keyframes iconPulse {
      0%   { box-shadow: 0 0 0 1px rgba(255, 184, 0, 0.4); }
      60%  { box-shadow: 0 0 0 7px rgba(255, 184, 0, 0); }
      100% { box-shadow: 0 0 0 1px rgba(255, 184, 0, 0.4); }
    }

    /* ---- 语言切换悬浮按钮 / Language toggle (bottom-right) ---- */
    .lang-toggle {
      position: fixed;
      right: calc(16px + env(safe-area-inset-right));
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 70;
      width: 52px; height: 52px; border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: var(--text); font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1px;
      transition: transform 0.15s ease, background 0.25s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .lang-toggle i { font-size: 10px; opacity: 0.8; }
    .lang-toggle:active { transform: scale(0.9); }
    .lang-toggle:hover { background: rgba(0, 0, 0, 0.7); }
  </style>
</head>

<body>
  <!-- ===================== 顶部安装提示 / Install hint (mobile only) ===================== -->
  <div class="install-hint" id="installHint" role="status">
    <span class="install-hint__icon"><i class="fa-solid fa-share-nodes" id="installHintIcon"></i></span>
    <span id="installHintText">Safari：点分享 →「添加到主屏幕」</span>
  </div>

  <!-- ===================== 主卡片 / Main Card ===================== -->
  <main class="card" id="card">
    <!-- 头像 (由 JS 根据 CARD_CONFIG.avatar 渲染) -->
    <div class="avatar" id="avatar"></div>

    <!-- 姓名 / 头衔 / 简介 -->
    <h1 class="name"  id="name"></h1>
    <p  class="title" id="title"></p>
    <p  class="bio"   id="bio"></p>

    <!-- 一键保存通讯录 -->
    <button class="btn-primary" id="saveContact">
      <i class="fa-solid fa-address-card"></i>
      <span id="saveContactText" data-i18n="save">保存到通讯录</span>
    </button>

    <!-- 社交按钮 (由 JS 根据 CARD_CONFIG.socials 渲染) -->
    <nav class="socials" id="socials" aria-label="Social links"></nav>

    <!-- 底部联系方式 + 分享 -->
    <footer class="footer" id="footer"></footer>
  </main>

  <!-- ===================== 微信弹窗 / WeChat Modal ===================== -->
  <div class="modal-overlay" id="wechatModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-icon"><i class="fa-brands fa-weixin"></i></div>
      <h3 id="wechatModalTitle" data-i18n="wechatTitle">微信</h3>
      <div id="qrContainer"></div>
      <p class="modal-wechat-id" id="wechatIdText"></p>
      <button class="modal-btn" id="copyWechatBtn" data-i18n="copyId">复制微信号</button>
    </div>
  </div>

  <!-- ===================== 语言切换 / Language toggle ===================== -->
  <button class="lang-toggle" id="langToggle" aria-label="Switch language / 切换语言">
    <i class="fa-solid fa-language"></i>
    <span id="langToggleLabel">EN</span>
  </button>

  <!-- ===================== QR 码弹窗 / QR Modal ===================== -->
  <div class="modal-overlay" id="qrModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="qrModalClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-icon" style="background:var(--accent);color:#1a1a1a"><i class="fa-solid fa-qrcode"></i></div>
      <h3 data-i18n="qrTitle">我的名片二维码</h3>
      <div id="qrCodeBox" style="display:flex;justify-content:center;margin-bottom:12px;"></div>
      <p class="modal-wechat-id" data-i18n="qrHint" style="margin-bottom:0;">对准二维码扫一扫，即可打开这张名片</p>
    </div>
  </div>

  <!-- ===================== Toast ===================== -->
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script>
  /* ======================================================================
     ⛟ CARD_CONFIG 已抽离到独立文件 config.js (小白只需改那一个文件!)
     ----------------------------------------------------------------------
     👉 修改内容请编辑仓库里的 config.js, 不要改本文件 index.html。
        index.html 会自动读取 config.js 里的 window.CARD_CONFIG。
        若 config.js 缺失, 下方提供"最小默认配置", 页面仍可渲染不报错。
        💡 不会写代码? 打开仓库里的 editor.html 可视化编辑器, 填表即可生成。
     ====================================================================== */
  const CARD_CONFIG = window.CARD_CONFIG || {
    name: "Your Name",
    title: "Your Title",
    bio: "Line one | Line two | Line three",
    avatar: { type: "text", imageUrl: "", text: "YN" },
    theme: { gradientStart: "#0d0d0d", gradientEnd: "#2a2300", accent: "#FFB800" },
    contact: { firstName: "Your", lastName: "Name", organization: "", title: "", phone: "", email: "", website: "", address: {} },
    socials: [
      { platform: "linkedin",  url: "#", label: "LinkedIn" },
      { platform: "wechat",    wechatId: "", qrImage: "", label: "WeChat" },
      { platform: "instagram", url: "#", label: "Instagram" },
      { platform: "facebook",  url: "#", label: "Facebook" }
    ],
    footer: { showPhone: false, showEmail: true }
  };


  /* ======================================================================
     ⛟ 以下为逻辑代码,一般无需修改 / Logic below — usually no need to edit.
     ====================================================================== */

  // ---------- 界面多语言 / UI i18n (EN / 中文) ----------
  // 界面文案双语切换; 名片内容(name/title/bio 等)来自 CARD_CONFIG, 不参与翻译。
  const I18N = {
    zh: {
      save: "保存到通讯录",
      wechatTitle: "微信",
      copyId: "复制微信号",
      qrPlaceholder: "在 CARD_CONFIG 中填写 qrImage 即可显示二维码",
      toastIdCopied: "已复制微信号",
      toastCopyFail: "复制失败,请手动复制",
      toastSaved: "名片已保存",
      toastLinkCopied: "链接已复制",
      toastLinkFail: "复制失败,请手动复制地址",
      installHintIOS: "Safari：点分享 →「添加到主屏幕」",
      installHintAndroid: "Chrome：菜单 ⋮ →「添加到主屏幕」",
      shareLink: "分享名片",
      sendVcf: "发我名片",
      qrLabel: "二维码",
      qrTitle: "我的名片二维码",
      qrHint: "对准二维码扫一扫，即可打开这张名片",
      ariaShare: "把这张名片的网址链接分享给他人",
      ariaVcf: "把我的联系方式以名片文件发送给对方，可直接存入通讯录",
      ariaQr: "打开二维码，供对方扫码查看我的名片"
    },
    en: {
      save: "Save Contact",
      wechatTitle: "WeChat",
      copyId: "Copy ID",
      qrPlaceholder: "Set qrImage in CARD_CONFIG to show your QR code",
      toastIdCopied: "WeChat ID copied",
      toastCopyFail: "Copy failed, please copy manually",
      toastSaved: "Contact saved",
      toastLinkCopied: "Link copied",
      toastLinkFail: "Copy failed, please copy the URL manually",
      installHintIOS: "Safari: tap Share → Add to Home Screen",
      installHintAndroid: "Chrome: menu ⋮ → Add to Home screen",
      shareLink: "Share Card",
      sendVcf: "Add me",
      qrLabel: "QR",
      qrTitle: "My card QR code",
      qrHint: "Point the camera at the QR code to open this card",
      ariaShare: "Share the link to this digital card",
      ariaVcf: "Send my contact details as a card file the recipient can save to contacts",
      ariaQr: "Show a QR code that opens this card"
    }
  };

  // 当前语言: localStorage 记忆 > 默认英文 (国际化优先, 与编辑器一致)
  let LANG = lsGet("nfc_card_lang");
  if (LANG !== "zh" && LANG !== "en") {
    LANG = "en";
  }
  // 平台识别: iOS 走 Safari 分享步骤, 其他(Android 等)走 Chrome 菜单步骤
  const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  function t(key) { return (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key; }

  function applyI18n() {
    document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (I18N[LANG][key] !== undefined) el.textContent = t(key);
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(el => {
      const key = el.getAttribute("data-i18n-aria");
      if (I18N[LANG][key] !== undefined) el.setAttribute("aria-label", t(key));
    });
    document.getElementById("langToggleLabel").textContent = LANG === "zh" ? "EN" : "中文";
    // 安装提示: 按平台显示对应浏览器的具体步骤 (图标也随之切换)
    const hintText = document.getElementById("installHintText");
    if (hintText) hintText.textContent = t(IS_IOS ? "installHintIOS" : "installHintAndroid");
    const hintIcon = document.getElementById("installHintIcon");
    if (hintIcon) hintIcon.className = IS_IOS ? "fa-solid fa-share-nodes" : "fa-solid fa-ellipsis-v";
  }

  function setLang(lang) {
    LANG = lang;
    lsSet("nfc_card_lang", lang);
    applyI18n();
    // 已打开过的微信弹窗内容也需要刷新文案
    const overlay = document.getElementById("wechatModal");
    if (overlay.classList.contains("show")) {
      // 简单处理: 关闭弹窗避免残留旧文案
      closeWechatModal();
    }
  }

  // ---------- 通用小工具 / Small shared helpers ----------
  // 弹窗遮罩开关 (微信弹窗 / QR 弹窗共用)
  function setOverlay(el, show) {
    el.classList.toggle("show", show);
    el.setAttribute("aria-hidden", show ? "false" : "true");
  }
  // localStorage 安全包装 (隐私模式等极端环境不抛异常)
  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* ignore */ } }
  // vCard 下载文件名 (downloadVCF / shareVCF 共用)
  function getVcfFileName() {
    return (CARD_CONFIG.contact.lastName + CARD_CONFIG.contact.firstName || "contact") + ".vcf";
  }

  // 社交平台元信息: 图标 (FontAwesome class) + 品牌色
  // Social platform metadata: icon class + brand color
  const SOCIAL_META = {
    linkedin:  { icon: "fa-brands fa-linkedin-in", color: "#0A66C2" },
    wechat:    { icon: "fa-brands fa-weixin",       color: "#07C160" },
    instagram: { icon: "fa-brands fa-instagram",    color: "#E4405F" },
    facebook:  { icon: "fa-brands fa-facebook-f",   color: "#1877F2" },
    twitter:   { icon: "fa-brands fa-x-twitter",    color: "#111111" },
    github:    { icon: "fa-brands fa-github",       color: "#181717" },
    youtube:   { icon: "fa-brands fa-youtube",      color: "#FF0000" },
    mail:      { icon: "fa-solid fa-envelope",      color: "#EA4335" },
    phone:     { icon: "fa-solid fa-phone",         color: "#34A853" },
    website:   { icon: "fa-solid fa-globe",         color: "#5F6368" }
  };

  // ---------- 工具: Toast 提示 ----------
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ---------- 工具: 复制到剪贴板 ----------
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        // 兼容非 HTTPS 环境 (如某些本地预览)
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  // ---------- 应用主题 / Apply theme ----------
  function applyTheme() {
    const r = document.documentElement.style;
    r.setProperty("--gradient-start", CARD_CONFIG.theme.gradientStart);
    r.setProperty("--gradient-end",   CARD_CONFIG.theme.gradientEnd);
    r.setProperty("--accent",         CARD_CONFIG.theme.accent);
    // 注意: og: 分享预览标签是静态的 (爬虫不执行 JS), 请直接编辑 <head> 里的 og: 标签。
    document.title = CARD_CONFIG.name + " · Digital Card";
  }

  // ---------- 渲染个人信息 / Render profile ----------
  function renderProfile() {
    document.getElementById("name").textContent  = CARD_CONFIG.name;
    document.getElementById("title").textContent = CARD_CONFIG.title;

    // 简介:按 "|" 拆分成多行,每段独立成行 (移动端更易读)
    const bioEl = document.getElementById("bio");
    bioEl.innerHTML = "";
    CARD_CONFIG.bio
      .split("|")
      .map(seg => seg.trim())
      .filter(Boolean)
      .forEach(seg => {
        const line = document.createElement("span");
        line.className = "bio-line";
        line.textContent = seg;
        bioEl.appendChild(line);
      });

    const avatarEl = document.getElementById("avatar");
    if (CARD_CONFIG.avatar.type === "image" && CARD_CONFIG.avatar.imageUrl) {
      const img = document.createElement("img");
      img.src = CARD_CONFIG.avatar.imageUrl;
      img.alt = CARD_CONFIG.name;
      avatarEl.appendChild(img);
    } else {
      avatarEl.textContent = CARD_CONFIG.avatar.text || CARD_CONFIG.name.charAt(0);
    }
  }

  // ---------- 渲染社交按钮 / Render social buttons ----------
  function renderSocials() {
    const container = document.getElementById("socials");
    CARD_CONFIG.socials.forEach(item => {
      const meta = SOCIAL_META[item.platform] || { icon: "fa-solid fa-link", color: "#888" };
      const btn = document.createElement("button");
      btn.className = "social-btn";
      btn.style.setProperty("--brand", meta.color);
      btn.setAttribute("aria-label", item.label || item.platform);
      btn.innerHTML = `<i class="${meta.icon}"></i>`;

      btn.addEventListener("click", () => {
        if (item.platform === "wechat") {
          openWechatModal(item);
        } else if (item.url) {
          window.open(item.url, "_blank", "noopener");
        }
      });
      container.appendChild(btn);
    });
  }

  // ---------- 渲染底部 / Render footer ----------
  function renderFooter() {
    const footer = document.getElementById("footer");
    const c = CARD_CONFIG.contact;
    const f = CARD_CONFIG.footer;

    if (f.showPhone && c.phone) {
      const row = document.createElement("a");
      row.className = "footer-row";
      row.href = "tel:" + c.phone;
      const ic = document.createElement("i");
      ic.className = "fa-solid fa-phone";
      const sp = document.createElement("span");
      sp.textContent = c.phone;
      row.append(ic, sp);
      footer.appendChild(row);
    }
    if (f.showEmail && c.email) {
      const row = document.createElement("a");
      row.className = "footer-row";
      row.href = "mailto:" + c.email;
      const ic = document.createElement("i");
      ic.className = "fa-solid fa-envelope";
      const sp = document.createElement("span");
      sp.textContent = c.email;
      row.append(ic, sp);
      footer.appendChild(row);
    }

    const shareRow = document.createElement("div");
    shareRow.className = "share-row";

    // 按钮 1: 分享名片链接 (系统分享面板, 含 AirDrop / 微信等)
    const shareBtn = document.createElement("button");
    shareBtn.className = "share-btn";
    shareBtn.setAttribute("data-i18n-aria", "ariaShare");
    shareBtn.setAttribute("aria-label", t("ariaShare"));
    shareBtn.innerHTML = `<i class="fa-solid fa-share-nodes"></i><span data-i18n="shareLink">${t("shareLink")}</span>`;
    shareBtn.addEventListener("click", shareCard);
    shareRow.appendChild(shareBtn);

    // 按钮 2: 发送 .vcf 名片文件 (Web Share Level 2, 可直接 AirDrop, 对方点开即存通讯录)
    const vcfBtn = document.createElement("button");
    vcfBtn.className = "share-btn";
    vcfBtn.setAttribute("data-i18n-aria", "ariaVcf");
    vcfBtn.setAttribute("aria-label", t("ariaVcf"));
    vcfBtn.innerHTML = `<i class="fa-solid fa-file-export"></i><span data-i18n="sendVcf">${t("sendVcf")}</span>`;
    vcfBtn.addEventListener("click", shareVCF);
    shareRow.appendChild(vcfBtn);

    // 按钮 3: 二维码 (没有 NFC 的场合扫码打开)
    const qrBtn = document.createElement("button");
    qrBtn.className = "share-btn";
    qrBtn.setAttribute("data-i18n-aria", "ariaQr");
    qrBtn.setAttribute("aria-label", t("ariaQr"));
    qrBtn.innerHTML = `<i class="fa-solid fa-qrcode"></i><span data-i18n="qrLabel">${t("qrLabel")}</span>`;
    qrBtn.addEventListener("click", openQrModal);
    shareRow.appendChild(qrBtn);

    footer.appendChild(shareRow);
  }

  // ---------- 微信弹窗 / WeChat modal ----------
  function openWechatModal(item) {
    const overlay = document.getElementById("wechatModal");
    const qrContainer = document.getElementById("qrContainer");
    const idText = document.getElementById("wechatIdText");
    const copyBtn = document.getElementById("copyWechatBtn");

    // 二维码
    qrContainer.innerHTML = "";
    if (item.qrImage) {
      const img = document.createElement("img");
      img.src = item.qrImage;
      img.alt = "WeChat QR";
      img.className = "modal-qr";
      qrContainer.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "modal-qr-placeholder";
      ph.textContent = t("qrPlaceholder");
      qrContainer.appendChild(ph);
    }

    // 微信号
    if (item.wechatId) {
      idText.textContent = "微信号 / WeChat ID: " + item.wechatId;
      copyBtn.style.display = "";
      copyBtn.onclick = async () => {
        const ok = await copyText(item.wechatId);
        showToast(ok ? t("toastIdCopied") : t("toastCopyFail"));
      };
    } else {
      idText.textContent = "";
      copyBtn.style.display = "none";
    }

    setOverlay(overlay, true);
  }

  function closeWechatModal() {
    setOverlay(document.getElementById("wechatModal"), false);
  }

  // ---------- 生成并下载 vCard (.vcf) ----------
  function generateVCF() {
    const c = CARD_CONFIG.contact;
    const a = c.address || {};
    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${c.lastName};${c.firstName};;;`,
      `FN:${CARD_CONFIG.name}`,
      c.organization ? `ORG:${c.organization}` : "",
      c.title        ? `TITLE:${c.title}`       : "",
      c.phone        ? `TEL;TYPE=CELL,VOICE:${c.phone}` : "",
      c.email        ? `EMAIL;TYPE=INTERNET,WORK:${c.email}` : "",
      c.website      ? `URL:${c.website}` : "",
      (a.street || a.city || a.region || a.zip || a.country)
        ? `ADR;TYPE=WORK:;;${a.street||""};${a.city||""};${a.region||""};${a.zip||""};${a.country||""}`
        : "",
      "END:VCARD"
    ].filter(Boolean);
    return lines.join("\r\n");
  }

  function downloadVCF() {
    const vcf = generateVCF();
    const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = getVcfFileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // 延迟释放: Safari 在 click 同步回收 blob URL 可能导致下载失败
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(t("toastSaved"));
  }

  // ---------- 分享 / Share ----------
  async function shareCard() {
    const shareData = {
      title: CARD_CONFIG.name,
      text: CARD_CONFIG.bio,
      url: location.href
    };
    // 优先使用系统原生分享 (移动端体验最佳)
    if (navigator.share) {
      try {
        await navigator.share(shareData);
        return;
      } catch (e) { /* 用户取消分享则回退到复制 */ }
    }
    // 回退: 复制链接到剪贴板
    const ok = await copyText(location.href);
    showToast(ok ? t("toastLinkCopied") : t("toastLinkFail"));
  }

  // ---------- 分享 .vcf 名片文件 / Share the vCard file (Web Share Level 2) ----------
  // iOS Safari / Android Chrome 支持直接分享文件 → 对方可通过 AirDrop / 微信等接收,
  // 收到后点开即存入通讯录。不支持分享文件的浏览器回退为直接下载。
  async function shareVCF() {
    const vcf = generateVCF();
    const file = new File([vcf], getVcfFileName(), { type: "text/vcard" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: CARD_CONFIG.name });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return; // 用户取消
      }
    }
    downloadVCF(); // 回退: 下载 .vcf
  }

  // ---------- 二维码弹窗 / QR modal ----------
  function openQrModal() {
    const overlay = document.getElementById("qrModal");
    const box = document.getElementById("qrCodeBox");
    box.innerHTML = "";
    if (typeof QRCode === "undefined") {
      // CDN 加载失败时回退为复制链接
      copyText(location.href).then(ok => showToast(ok ? t("toastLinkCopied") : t("toastLinkFail")));
      return;
    }
    new QRCode(box, {
      text: location.href,
      width: 180, height: 180,
      colorDark: "#111111", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
    setOverlay(overlay, true);
  }

  function closeQrModal() {
    setOverlay(document.getElementById("qrModal"), false);
  }

  // ---------- 初始化 / Init ----------
  function init() {
    applyTheme();
    renderProfile();
    renderSocials();
    applyI18n();      // 先设置界面语言, renderFooter 会用当前语言生成按钮文案
    renderFooter();

    document.getElementById("saveContact").addEventListener("click", downloadVCF);

    // 语言切换按钮 / Language toggle
    document.getElementById("langToggle").addEventListener("click", () => {
      setLang(LANG === "zh" ? "en" : "zh");
    });

    // 顶部安装提示: 仅移动端显示; 已安装到主屏幕(独立窗口模式)则不再提示
    const hint = document.getElementById("installHint");
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;   // iOS Safari 添加到主屏幕后的标记
    if (!isStandalone && window.matchMedia("(max-width: 520px)").matches) {
      requestAnimationFrame(() => requestAnimationFrame(() => hint.classList.add("show")));
      setTimeout(() => {
        hint.classList.add("hide");
        setTimeout(() => { hint.style.display = "none"; }, 600); // 等淡出动画结束再移除
      }, 5000);
    }

    // 关闭弹窗: 点击遮罩或关闭按钮
    document.getElementById("modalClose").addEventListener("click", closeWechatModal);
    document.getElementById("wechatModal").addEventListener("click", (e) => {
      if (e.target.id === "wechatModal") closeWechatModal();
    });
    document.getElementById("qrModalClose").addEventListener("click", closeQrModal);
    document.getElementById("qrModal").addEventListener("click", (e) => {
      if (e.target.id === "qrModal") closeQrModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeWechatModal(); closeQrModal(); }
    });
  }

  document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
